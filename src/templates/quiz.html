{% extends "base.html" %}

{% block head_extra %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
    .quiz-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
    }

    .quiz-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .quiz-header h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: bold;
    }

    .quiz-header p {
        margin: 10px 0 0 0;
        font-size: 1.2rem;
        opacity: 0.9;
    }

    /* قسم اختيار نطاق الاختبار */
    .quiz-selector {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        margin-bottom: 30px;
    }

    .quiz-selector h3 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.5rem;
    }

    .selector-group {
        margin-bottom: 20px;
    }

    .selector-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
    }

    .selector-group select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .selector-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .quiz-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }

    .quiz-option {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .quiz-option input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }

    .quiz-option label {
        margin: 0;
        cursor: pointer;
        font-weight: normal;
    }

    .start-quiz-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.2rem;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
        width: 100%;
        font-weight: bold;
    }

    .start-quiz-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .start-quiz-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    /* بطاقة السؤال */
    .question-card {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        margin-bottom: 30px;
        display: none;
    }

    .question-card.active {
        display: block;
        animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(50px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e0e0e0;
    }

    .question-number {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 1.1rem;
    }

    .question-info {
        text-align: left;
        font-size: 0.9rem;
        color: #666;
    }

    .question-text {
        font-size: 1.3rem;
        color: #333;
        margin-bottom: 20px;
        line-height: 1.6;
        font-weight: 500;
    }

    .question-image {
        max-width: 100%;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .options-container {
        margin-top: 25px;
    }

    .option-item {
        background: #f8f9fa;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 15px 20px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .option-item:hover {
        background: #e9ecef;
        border-color: #667eea;
        transform: translateX(-5px);
    }

    .option-item.selected {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }

    .option-item.correct {
        background: #28a745;
        color: white;
        border-color: #28a745;
    }

    .option-item.incorrect {
        background: #dc3545;
        color: white;
        border-color: #dc3545;
    }

    .option-item.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }

    .option-letter {
        background: white;
        color: #667eea;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        flex-shrink: 0;
    }

    .option-item.selected .option-letter,
    .option-item.correct .option-letter,
    .option-item.incorrect .option-letter {
        background: rgba(255,255,255,0.3);
        color: white;
    }

    .option-text {
        flex: 1;
        font-size: 1.1rem;
    }

    .option-image {
        max-width: 200px;
        border-radius: 8px;
        margin-top: 10px;
    }

    /* أزرار التحكم */
    .quiz-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        gap: 15px;
    }

    .quiz-btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
    }

    .btn-prev {
        background: #6c757d;
        color: white;
    }

    .btn-prev:hover {
        background: #5a6268;
    }

    .btn-next {
        background: #667eea;
        color: white;
    }

    .btn-next:hover {
        background: #5568d3;
    }

    .btn-check {
        background: #28a745;
        color: white;
    }

    .btn-check:hover {
        background: #218838;
    }

    .btn-finish {
        background: #dc3545;
        color: white;
    }

    .btn-finish:hover {
        background: #c82333;
    }

    .quiz-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }

    /* شريط التقدم */
    .progress-bar-container {
        background: #e0e0e0;
        height: 10px;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 30px;
    }

    .progress-bar-fill {
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        height: 100%;
        transition: width 0.5s ease;
    }

    .progress-text {
        text-align: center;
        margin-bottom: 10px;
        color: #666;
        font-weight: bold;
    }

    /* نتيجة الاختبار */
    .quiz-result {
        background: white;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        text-align: center;
        display: none;
    }

    .quiz-result.active {
        display: block;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .result-score {
        font-size: 4rem;
        font-weight: bold;
        color: #667eea;
        margin: 20px 0;
    }

    .result-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin: 30px 0;
    }

    .result-item {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
    }

    .result-item h4 {
        margin: 0 0 10px 0;
        color: #666;
        font-size: 0.9rem;
    }

    .result-item p {
        margin: 0;
        font-size: 2rem;
        font-weight: bold;
        color: #333;
    }

    .result-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
    }

    .hidden {
        display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .quiz-header h1 {
            font-size: 1.8rem;
        }

        .question-text {
            font-size: 1.1rem;
        }

        .quiz-controls {
            flex-direction: column;
        }

        .quiz-btn {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="quiz-container">
    <!-- رأس الصفحة -->
    <div class="quiz-header">
        <h1><i class="fas fa-graduation-cap"></i> الاختبار التفاعلي</h1>
        <p>اختبر معلوماتك في الكيمياء</p>
    </div>

    <!-- قسم اختيار نطاق الاختبار -->
    <div class="quiz-selector" id="quizSelector">
        <h3><i class="fas fa-sliders-h"></i> اختر نطاق الاختبار</h3>
        
        <div class="selector-group">
            <label for="courseSelect"><i class="fas fa-book"></i> المنهج:</label>
            <select id="courseSelect" class="form-select">
                <option value="">-- اختر المنهج --</option>
            </select>
        </div>

        <div class="selector-group">
            <label for="unitSelect"><i class="fas fa-bookmark"></i> الوحدة (اختياري):</label>
            <select id="unitSelect" class="form-select" disabled>
                <option value="">-- اختر الوحدة --</option>
            </select>
        </div>

        <div class="selector-group">
            <label for="lessonSelect"><i class="fas fa-file-alt"></i> الدرس (اختياري):</label>
            <select id="lessonSelect" class="form-select" disabled>
                <option value="">-- اختر الدرس --</option>
            </select>
        </div>

        <div class="quiz-options">
            <div class="quiz-option">
                <input type="checkbox" id="randomOrder" checked>
                <label for="randomOrder">ترتيب عشوائي</label>
            </div>
            <div class="quiz-option">
                <input type="checkbox" id="showCorrectAnswer">
                <label for="showCorrectAnswer">إظهار الإجابة الصحيحة</label>
            </div>
        </div>

        <button class="start-quiz-btn" id="startQuizBtn" disabled>
            <i class="fas fa-play"></i> ابدأ الاختبار
        </button>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-container hidden" id="progressContainer">
        <div class="progress-text" id="progressText">السؤال 1 من 10</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
        </div>
    </div>

    <!-- بطاقة السؤال -->
    <div class="question-card" id="questionCard">
        <div class="question-header">
            <div class="question-number" id="questionNumber">السؤال 1</div>
            <div class="question-info" id="questionInfo">
                <div><i class="fas fa-book"></i> <span id="courseName"></span></div>
                <div><i class="fas fa-bookmark"></i> <span id="unitName"></span></div>
                <div><i class="fas fa-file-alt"></i> <span id="lessonName"></span></div>
            </div>
        </div>

        <div class="question-text" id="questionText"></div>
        <img class="question-image hidden" id="questionImage" alt="صورة السؤال">

        <div class="options-container" id="optionsContainer"></div>

        <div class="quiz-controls">
            <button class="quiz-btn btn-prev" id="prevBtn" onclick="previousQuestion()">
                <i class="fas fa-arrow-right"></i> السابق
            </button>
            <button class="quiz-btn btn-check" id="checkBtn" onclick="checkAnswer()">
                <i class="fas fa-check"></i> تحقق من الإجابة
            </button>
            <button class="quiz-btn btn-next" id="nextBtn" onclick="nextQuestion()">
                التالي <i class="fas fa-arrow-left"></i>
            </button>
            <button class="quiz-btn btn-finish hidden" id="finishBtn" onclick="finishQuiz()">
                <i class="fas fa-flag-checkered"></i> إنهاء الاختبار
            </button>
        </div>
    </div>

    <!-- نتيجة الاختبار -->
    <div class="quiz-result" id="quizResult">
        <h2><i class="fas fa-trophy"></i> نتيجة الاختبار</h2>
        <div class="result-score" id="resultScore">0%</div>
        
        <div class="result-details">
            <div class="result-item">
                <h4>إجمالي الأسئلة</h4>
                <p id="totalQuestions">0</p>
            </div>
            <div class="result-item">
                <h4>إجابات صحيحة</h4>
                <p id="correctAnswers" style="color: #28a745;">0</p>
            </div>
            <div class="result-item">
                <h4>إجابات خاطئة</h4>
                <p id="incorrectAnswers" style="color: #dc3545;">0</p>
            </div>
        </div>

        <div class="result-actions">
            <button class="quiz-btn btn-next" onclick="location.reload()">
                <i class="fas fa-redo"></i> اختبار جديد
            </button>
            <button class="quiz-btn btn-prev" onclick="window.location.href='{{ url_for('dashboard') }}'">
                <i class="fas fa-home"></i> العودة للرئيسية
            </button>
        </div>
    </div>
</div>

<script>
// متغيرات عامة
let questions = [];
let currentQuestionIndex = 0;
let userAnswers = [];
let correctCount = 0;
let showCorrectAnswerMode = false;

// دالة للحصول على CSRF Token
function getCSRFToken() {
    const metaTag = document.querySelector('meta[name="csrf-token"]');
    if (metaTag) return metaTag.getAttribute('content');
    
    const hiddenInput = document.querySelector('input[name="csrf_token"]');
    if (hiddenInput) return hiddenInput.value;
    
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === 'csrf_token') return value;
    }
    
    return null;
}

// تحميل المناهج عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', async function() {
    await loadCourses();
    
    document.getElementById('courseSelect').addEventListener('change', onCourseChange);
    document.getElementById('unitSelect').addEventListener('change', onUnitChange);
    document.getElementById('startQuizBtn').addEventListener('click', startQuiz);
});

// تحميل المناهج - استخدام API الموجودة
async function loadCourses() {
    try {
        const response = await fetch('/api/v1/courses');
        const data = await response.json();
        
        const courseSelect = document.getElementById('courseSelect');
        data.forEach(course => {
            const option = document.createElement('option');
            option.value = course.id;
            option.textContent = course.name;
            courseSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading courses:', error);
        alert('حدث خطأ في تحميل المناهج');
    }
}

// عند تغيير المنهج
async function onCourseChange() {
    const courseId = this.value;
    const unitSelect = document.getElementById('unitSelect');
    const lessonSelect = document.getElementById('lessonSelect');
    const startBtn = document.getElementById('startQuizBtn');
    
    unitSelect.innerHTML = '<option value="">-- اختر الوحدة --</option>';
    lessonSelect.innerHTML = '<option value="">-- اختر الدرس --</option>';
    lessonSelect.disabled = true;
    
    if (courseId) {
        unitSelect.disabled = false;
        startBtn.disabled = false;
        
        try {
            const response = await fetch(`/api/v1/courses/${courseId}/units`);
            const data = await response.json();
            
            data.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit.id;
                option.textContent = unit.name;
                unitSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading units:', error);
        }
    } else {
        unitSelect.disabled = true;
        startBtn.disabled = true;
    }
}

// عند تغيير الوحدة
async function onUnitChange() {
    const unitId = this.value;
    const lessonSelect = document.getElementById('lessonSelect');
    
    lessonSelect.innerHTML = '<option value="">-- اختر الدرس --</option>';
    
    if (unitId) {
        lessonSelect.disabled = false;
        
        try {
            const response = await fetch(`/api/v1/units/${unitId}/lessons`);
            const data = await response.json();
            
            data.forEach(lesson => {
                const option = document.createElement('option');
                option.value = lesson.id;
                option.textContent = lesson.name;
                lessonSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading lessons:', error);
        }
    } else {
        lessonSelect.disabled = true;
    }
}

// بدء الاختبار - استخدام API الموجودة
async function startQuiz() {
    const courseId = document.getElementById('courseSelect').value;
    const unitId = document.getElementById('unitSelect').value;
    const lessonId = document.getElementById('lessonSelect').value;
    const randomOrder = document.getElementById('randomOrder').checked;
    showCorrectAnswerMode = document.getElementById('showCorrectAnswer').checked;
    
    if (!courseId) {
        alert('الرجاء اختيار منهج على الأقل');
        return;
    }
    
    // بناء URL حسب الاختيار
    let url;
    if (lessonId) {
        url = `/api/v1/lessons/${lessonId}/questions`;
    } else if (unitId) {
        url = `/api/v1/units/${unitId}/questions`;
    } else {
        url = `/api/v1/courses/${courseId}/questions`;
    }
    
    try {
        const response = await fetch(url);
        let data = await response.json();
        
        if (data && data.length > 0) {
            // ترتيب عشوائي إذا كان مطلوباً
            if (randomOrder) {
                data = data.sort(() => Math.random() - 0.5);
            }
            
            questions = data;
            userAnswers = new Array(questions.length).fill(null);
            currentQuestionIndex = 0;
            correctCount = 0;
            
            document.getElementById('quizSelector').classList.add('hidden');
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('questionCard').classList.add('active');
            
            displayQuestion();
        } else {
            alert('لا توجد أسئلة متاحة في النطاق المحدد');
        }
    } catch (error) {
        console.error('Error starting quiz:', error);
        alert('حدث خطأ في بدء الاختبار');
    }
}

// عرض السؤال
function displayQuestion() {
    const question = questions[currentQuestionIndex];
    
    const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
    document.getElementById('progressText').textContent = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
    document.getElementById('progressBarFill').style.width = `${progress}%`;
    
    document.getElementById('questionNumber').textContent = `السؤال ${currentQuestionIndex + 1}`;
    document.getElementById('courseName').textContent = question.course_name || 'غير محدد';
    document.getElementById('unitName').textContent = question.unit_name || 'غير محدد';
    document.getElementById('lessonName').textContent = question.lesson_name || 'غير محدد';
    
    document.getElementById('questionText').textContent = question.question_text || '';
    
    const questionImage = document.getElementById('questionImage');
    if (question.image_url) {
        questionImage.src = question.image_url;
        questionImage.classList.remove('hidden');
    } else {
        questionImage.classList.add('hidden');
    }
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    const letters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];
    question.options.forEach((option, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-item';
        optionDiv.dataset.optionId = option.option_id;
        optionDiv.dataset.isCorrect = option.is_correct;
        
        if (userAnswers[currentQuestionIndex] === option.option_id) {
            optionDiv.classList.add('selected');
        }
        
        let optionContent = option.option_text || '';
        if (option.image_url) {
            optionContent += `<br><img src="${option.image_url}" class="option-image" alt="صورة الخيار">`;
        }
        
        optionDiv.innerHTML = `
            <div class="option-letter">${letters[index]}</div>
            <div class="option-text">${optionContent}</div>
        `;
        
        optionDiv.addEventListener('click', function() {
            selectOption(this);
        });
        
        optionsContainer.appendChild(optionDiv);
    });
    
    document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
    document.getElementById('nextBtn').classList.toggle('hidden', currentQuestionIndex === questions.length - 1);
    document.getElementById('finishBtn').classList.toggle('hidden', currentQuestionIndex !== questions.length - 1);
    document.getElementById('checkBtn').disabled = userAnswers[currentQuestionIndex] === null;
}

// اختيار خيار
function selectOption(optionElement) {
    document.querySelectorAll('.option-item').forEach(item => {
        item.classList.remove('selected');
    });
    
    optionElement.classList.add('selected');
    userAnswers[currentQuestionIndex] = parseInt(optionElement.dataset.optionId);
    document.getElementById('checkBtn').disabled = false;
}

// التحقق من الإجابة
function checkAnswer() {
    const selectedOption = document.querySelector('.option-item.selected');
    if (!selectedOption) return;
    
    const isCorrect = selectedOption.dataset.isCorrect === 'true';
    
    if (isCorrect) {
        selectedOption.classList.add('correct');
        correctCount++;
        alert('✅ إجابة صحيحة!');
    } else {
        selectedOption.classList.add('incorrect');
        
        if (showCorrectAnswerMode) {
            document.querySelectorAll('.option-item').forEach(item => {
                if (item.dataset.isCorrect === 'true') {
                    item.classList.add('correct');
                }
            });
        }
        
        alert('❌ إجابة خاطئة!');
    }
    
    document.querySelectorAll('.option-item').forEach(item => {
        item.classList.add('disabled');
        item.style.pointerEvents = 'none';
    });
    
    document.getElementById('checkBtn').classList.add('hidden');
}

// السؤال التالي
function nextQuestion() {
    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        
        document.querySelectorAll('.option-item').forEach(item => {
            item.style.pointerEvents = 'auto';
        });
        
        document.getElementById('checkBtn').classList.remove('hidden');
        displayQuestion();
    }
}

// السؤال السابق
function previousQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        
        document.querySelectorAll('.option-item').forEach(item => {
            item.style.pointerEvents = 'auto';
        });
        
        document.getElementById('checkBtn').classList.remove('hidden');
        displayQuestion();
    }
}

// إنهاء الاختبار
function finishQuiz() {
    const totalQuestions = questions.length;
    const incorrectCount = totalQuestions - correctCount;
    const scorePercentage = ((correctCount / totalQuestions) * 100).toFixed(1);
    
    document.getElementById('questionCard').classList.remove('active');
    document.getElementById('progressContainer').classList.add('hidden');
    
    document.getElementById('resultScore').textContent = `${scorePercentage}%`;
    document.getElementById('totalQuestions').textContent = totalQuestions;
    document.getElementById('correctAnswers').textContent = correctCount;
    document.getElementById('incorrectAnswers').textContent = incorrectCount;
    document.getElementById('quizResult').classList.add('active');
}
</script>
{% endblock %}
