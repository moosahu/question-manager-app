{% extends "base.html" %}

{% block title %}إضافة معلم جديد{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 700px;
        margin: 0 auto;
    }
    
    .form-header {
        background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        color: white;
        padding: 2rem;
        border-radius: 15px 15px 0 0;
        text-align: center;
    }
    
    .form-header i {
        font-size: 3rem;
        margin-bottom: 1rem;
    }
    
    .form-body {
        background: white;
        padding: 2rem;
        border-radius: 0 0 15px 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
    }
    
    .form-group label .required {
        color: #dc3545;
    }
    
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 0.3s;
    }
    
    .form-control:focus {
        border-color: #9b59b6;
        outline: none;
    }
    
    .form-row {
        display: flex;
        gap: 1rem;
    }
    
    .form-row .form-group {
        flex: 1;
    }
    
    .form-check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 10px;
    }
    
    .form-check input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }
    
    .form-check label {
        margin: 0;
        cursor: pointer;
    }
    
    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    
    .btn-submit:hover {
        opacity: 0.9;
    }
    
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: #9b59b6;
        text-decoration: none;
        margin-bottom: 1rem;
    }
    
    .btn-back:hover {
        text-decoration: underline;
    }
    
    .password-hint {
        font-size: 0.85rem;
        color: #666;
        margin-top: 0.25rem;
    }
    
    select.form-control {
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="form-container">
        <a href="{{ url_for('teachers.list_teachers') }}" class="btn-back">
            <i class="fas fa-arrow-right"></i> العودة لقائمة المعلمين
        </a>
        
        <div class="form-header">
            <i class="fas fa-chalkboard-teacher"></i>
            <h2>إضافة معلم جديد</h2>
            <p>أدخل بيانات المعلم لإنشاء حساب جديد</p>
        </div>
        
        <div class="form-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <!-- الاسم -->
                <div class="form-group">
                    <label><i class="fas fa-user"></i> الاسم الكامل <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required placeholder="أدخل اسم المعلم">
                </div>
                
                <!-- اسم المستخدم وكلمة المرور -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-at"></i> اسم المستخدم <span class="required">*</span></label>
                        <input type="text" name="username" class="form-control" required placeholder="اسم المستخدم للدخول">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> كلمة المرور <span class="required">*</span></label>
                        <input type="password" name="password" class="form-control" required placeholder="كلمة المرور">
                        <p class="password-hint">يفضل أن تكون 6 أحرف على الأقل</p>
                    </div>
                </div>
                
                <!-- البريد والجوال -->
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" name="email" class="form-control" placeholder="اختياري">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الجوال</label>
                        <input type="tel" name="phone" class="form-control" placeholder="05xxxxxxxx">
                    </div>
                </div>
                
                <!-- المدرسة -->
                <div class="form-group">
                    <label><i class="fas fa-school"></i> المدرسة</label>
                    <input type="text" name="school" class="form-control" placeholder="اسم المدرسة">
                </div>
                
                <!-- ملاحظات -->
                <div class="form-group">
                    <label><i class="fas fa-sticky-note"></i> ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
                </div>
                
                <!-- تفعيل الحساب -->
                <div class="form-check">
                    <input type="checkbox" name="is_active" id="is_active" checked>
                    <label for="is_active">
                        <i class="fas fa-check-circle text-success"></i>
                        تفعيل الحساب مباشرة
                    </label>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus-circle"></i>
                    إضافة المعلم
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
